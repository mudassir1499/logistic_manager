name: mudassir_app
description: Mudassir LLC — sourcing and logistics customer app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # The two smallest dependencies that do the job. http is the official client
  # and works on every platform including web, where dart:io does not exist.
  http: ^1.6.0
  # Token storage. The token is the credential, so it must survive a restart or
  # the app asks for a password every launch.
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
