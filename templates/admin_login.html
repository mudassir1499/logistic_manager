{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Admin Login — LogiManager</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'style.css' %}?v=mono-gold-2">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F3F4F7 0%, #E8E9ED 45%, #FAFBFC 100%);
            font-family: var(--font-family);
        }
        .login-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
        }
        .login-brand {
            margin-bottom: 0.75rem;
        }
        .login-brand-img { width: 48px; height: 48px; display: inline-block; }
        .login-card .form-control,
        .login-card .input-group-text {
            background: var(--bg-input);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .login-card .form-control:focus {
            background: #fff;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(176, 132, 33, 0.20);
        }
        .login-card .input-group-text {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    
    <div class="login-card text-center">
        
        <div class="login-brand"><img src="{% if settings.logo %}{{ settings.logo.url }}{% else %}{% static 'images/icon-192.png' %}{% endif %}" alt="" width="48" height="48" class="login-brand-img" style="border-radius:12px;object-fit:contain;" decoding="async"></div>
        <h4 class="fw-bold mb-1">Admin Login</h4>
        <p class="text-secondary small mb-4">Log in to access the admin dashboard</p>

        
        {% if form.errors %}
        
        <div class="alert alert-danger py-2 small mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>Invalid username or password.
        </div>
        {% endif %}  

        
        <form method="post" action="{% url 'admin_login' %}">
            {% csrf_token %}  
            
            <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">

            
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold">Username</label>
                <div class="input-group">
                    
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                    
                </div>
            </div>

            
            <div class="mb-4 text-start">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    
                    <input type="password" name="password" class="form-control" placeholder="••••••" required>
                </div>
            </div>

            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-glow">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Log In
                </button>
            </div>
        </form>

        
        <div class="mt-3 text-secondary small">
            <a href="/" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Website</a>
        </div>
    </div>

</body>
</html>
