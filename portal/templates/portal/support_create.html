{% extends 'portal/base.html' %}
{% load static %}

{% block title %}New Support Ticket{% endblock %}

{% block content %}
<section class="py-4">
  <div class="container" style="max-width: 720px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h4 class="fw-bold mb-0"><i class="bi bi-life-preserver me-2"></i>New Support Ticket</h4>
      <a href="{% url 'portal_support_list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    {% if messages %}{% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }} py-2 small">{{ m }}</div>
    {% endfor %}{% endif %}

    <div class="card">
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">Subject</label>
            <input type="text" name="subject" class="form-control" value="{{ form_data.subject|default:'' }}" required>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Category</label>
              <select name="category" class="form-select">
                {% for value, label in categories %}
                <option value="{{ value }}" {% if form_data.category == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Priority</label>
              <select name="priority" class="form-select">
                {% for value, label in priorities %}
                <option value="{{ value }}" {% if form_data.priority == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label small fw-semibold">Message</label>
            <textarea name="body" class="form-control" rows="5" required>{{ form_data.body|default:'' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Attachments (optional)</label>
            <input type="file" name="attachments" class="form-control" multiple>
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Submit Ticket</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
